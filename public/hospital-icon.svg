<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Noor Hospital</title>
  <desc id="desc">A modern multi-storey hospital building with a red medical cross, blue windows, entrance and ambulance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3d91"/><stop offset=".55" stop-color="#1689df"/><stop offset="1" stop-color="#b7e7ff"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dce8f5"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ce8ff"/><stop offset=".45" stop-color="#168bd0"/><stop offset="1" stop-color="#064b91"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#8cb8d6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#062c61" flood-opacity=".38"/></filter>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="94"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <path d="M0 130H512M0 160H512" stroke="#b9eaff" stroke-opacity=".25" stroke-width="3"/>
    <path d="M0 435Q120 410 256 433T512 425V512H0Z" fill="url(#ground)"/>
    <g filter="url(#shadow)">
      <!-- Main hospital wings -->
      <path d="M64 212L155 162H357L448 212V424H64Z" fill="url(#wall)" stroke="#c4d8eb" stroke-width="4"/>
      <path d="M64 212L155 162V424H64Z" fill="#f8fcff"/>
      <path d="M357 162L448 212V424H357Z" fill="#e7f1fa"/>
      <!-- side wing windows -->
      <g fill="url(#glass)" stroke="#b4d8f0" stroke-width="4">
        <rect x="82" y="232" width="58" height="46" rx="4"/><rect x="82" y="294" width="58" height="46" rx="4"/><rect x="82" y="356" width="58" height="45" rx="4"/>
        <rect x="372" y="232" width="58" height="46" rx="4"/><rect x="372" y="294" width="58" height="46" rx="4"/><rect x="372" y="356" width="58" height="45" rx="4"/>
      </g>
      <!-- central tower -->
      <path d="M151 190Q151 130 210 130H302Q361 130 361 190V424H151Z" fill="url(#wall)" stroke="#c3d8eb" stroke-width="4"/>
      <path d="M171 206H341V258H171Z" fill="url(#glass)" stroke="#b7d9ee" stroke-width="4"/>
      <path d="M171 274H341V326H171Z" fill="url(#glass)" stroke="#b7d9ee" stroke-width="4"/>
      <path d="M171 342H341V424H171Z" fill="url(#glass)" stroke="#b7d9ee" stroke-width="4"/>
      <g stroke="#d8efff" stroke-width="4" opacity=".9"><path d="M227 206V258M284 206V258M227 274V326M284 274V326M227 342V424M284 342V424"/></g>
      <!-- roof and medical sign -->
      <path d="M143 190Q143 112 214 112H298Q369 112 369 190" fill="#f7fbff" stroke="#c4d8eb" stroke-width="8"/>
      <circle cx="256" cy="151" r="42" fill="#fff" stroke="#b9d5ec" stroke-width="5"/>
      <path d="M244 121H268V139H286V163H268V181H244V163H226V139H244Z" fill="#e52335"/>
      <!-- entrance canopy -->
      <path d="M136 392H376L394 414H118Z" fill="#fff" stroke="#bdd4e9" stroke-width="4"/>
      <path d="M153 414H359V438H153Z" fill="#eaf5fc"/>
      <path d="M202 414V438M310 414V438" stroke="#9bbbd4" stroke-width="5"/>
    </g>
    <!-- trees -->
    <g><path d="M47 421V370M465 421V370" stroke="#6d573c" stroke-width="10"/><circle cx="47" cy="357" r="28" fill="#38a96b"/><circle cx="465" cy="357" r="28" fill="#38a96b"/><circle cx="34" cy="373" r="17" fill="#63c982"/><circle cx="478" cy="373" r="17" fill="#63c982"/></g>
    <!-- ambulance -->
    <g transform="translate(330 390)">
      <path d="M5 28Q5 14 20 14H91L111 34V66H5Z" fill="#fff" stroke="#52799a" stroke-width="4"/>
      <path d="M76 18H91L104 34H76Z" fill="#8edbff" stroke="#52799a" stroke-width="3"/>
      <path d="M16 35H65V53H16Z" fill="#e52d3d"/>
      <path d="M36 37H46V43H53V51H46V58H36V51H29V43H36Z" fill="#fff"/>
      <rect x="30" y="7" width="17" height="7" rx="3" fill="#e52d3d"/><rect x="49" y="7" width="17" height="7" rx="3" fill="#2389e6"/>
      <circle cx="28" cy="66" r="10" fill="#263d55" stroke="#d8e8f5" stroke-width="4"/><circle cx="88" cy="66" r="10" fill="#263d55" stroke="#d8e8f5" stroke-width="4"/>
    </g>
    <!-- foreground nameplate -->
    <rect x="115" y="454" width="282" height="34" rx="17" fill="#073b79" stroke="#bde8ff" stroke-width="2"/>
    <text x="256" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#fff">NOOR HOSPITAL</text>
    <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#d5f2ff" stroke-width="8"/>
  </g>
</svg>
